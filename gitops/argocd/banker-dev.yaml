# Dev: fully automated. Every commit to k8s/overlays/dev (e.g. CI bumping the image tag) is synced.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: banker-platform-dev
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: javabanker
  source:
    repoURL: https://github.com/marcomaggiotti/JavaBankerApp.git
    targetRevision: main
    path: k8s/overlays/dev
  destination:
    server: https://kubernetes.default.svc
    namespace: banker-dev
  syncPolicy:
    automated:
      prune: true      # delete resources removed from Git
      selfHeal: true   # revert manual kubectl changes (Git is the source of truth)
    syncOptions:
      - CreateNamespace=true
