# Flux equivalent of gitops/argocd/banker-dev.yaml (pick one tool, not both, per cluster).
apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: javabanker
  namespace: flux-system
spec:
  interval: 1m
  url: https://github.com/marcomaggiotti/JavaBankerApp.git
  ref:
    branch: main
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: banker-platform-dev
  namespace: flux-system
spec:
  interval: 5m
  sourceRef:
    kind: GitRepository
    name: javabanker
  path: ./k8s/overlays/dev
  prune: true
  wait: true
