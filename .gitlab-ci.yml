# GitLab CI: build -> test -> package image -> GitOps promotion.
# CI never runs `kubectl apply`: it only changes Git; ArgoCD/Flux pulls the change into the cluster.
stages:
  - build
  - test
  - package
  - deploy

variables:
  MAVEN_OPTS: "-Dmaven.repo.local=$CI_PROJECT_DIR/.m2/repository"
  MAVEN_CLI_OPTS: "-B --no-transfer-progress"
  IMAGE: "$CI_REGISTRY_IMAGE"
  IMAGE_TAG: "$CI_COMMIT_SHORT_SHA"

default:
  image: maven:3.9-eclipse-temurin-21
  cache:
    key:
      files: [pom.xml]
    paths: [.m2/repository]

compile:
  stage: build
  script:
    - mvn $MAVEN_CLI_OPTS compile

unit-test:
  stage: test
  script:
    - mvn $MAVEN_CLI_OPTS verify
  artifacts:
    when: always
    reports:
      junit:
        - target/surefire-reports/TEST-*.xml
        - target/failsafe-reports/TEST-*.xml
    paths: [target/banker-platform.jar]
    expire_in: 1 week

validate-manifests:
  stage: test
  image:
    name: registry.k8s.io/kubectl:v1.31.0
    entrypoint: [""]
  cache: []
  script:
    - kubectl kustomize k8s/overlays/dev > /dev/null
    - kubectl kustomize k8s/overlays/prod > /dev/null

docker-image:
  stage: package
  image: docker:27
  services: [docker:27-dind]
  cache: []
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
    - docker build -t "$IMAGE:$IMAGE_TAG" .
    - docker push "$IMAGE:$IMAGE_TAG"

# GitOps: bump the image tag in the dev overlay and push. ArgoCD (automated sync) deploys it.
# Needs a project access token with write_repository in the masked variable GITOPS_TOKEN.
promote-dev:
  stage: deploy
  image: registry.gitlab.com/gitlab-ci-utils/curl-jq:latest
  cache: []
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $GITOPS_TOKEN
  before_script:
    - apk add --no-cache git kustomize || true
  script:
    - git config user.email "ci@example.com" && git config user.name "GitLab CI"
    - cd k8s/overlays/dev && kustomize edit set image "banker-platform=$IMAGE:$IMAGE_TAG" && cd -
    - git commit -am "chore(gitops): deploy $IMAGE_TAG to dev [skip ci]"
    - git push "https://oauth2:${GITOPS_TOKEN}@${CI_SERVER_HOST}/${CI_PROJECT_PATH}.git" HEAD:$CI_DEFAULT_BRANCH

# Prod promotion is a reviewed merge request changing k8s/overlays/prod (four-eyes principle).
