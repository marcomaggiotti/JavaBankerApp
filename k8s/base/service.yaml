apiVersion: v1
kind: Service
metadata:
  name: banker-platform
spec:
  selector: {}
  ports:
    - name: http
      port: 80
      targetPort: http
---
# Headless service: gives each StatefulSet pod a stable DNS name
# (needed for application.server / interactive-query forwarding between instances)
apiVersion: v1
kind: Service
metadata:
  name: banker-platform-headless
spec:
  clusterIP: None
  selector: {}
  ports:
    - name: http
      port: 8080
      targetPort: http
