# Everything in one command, no tokens or credentials needed:
#
#   docker compose up --build          (or: podman compose up --build)
#
#   API       http://localhost:18080  (e.g. GET /api/accounts/acc-1/balance)
#   Kafka UI  http://localhost:18081  (browse topics: balances, rejected, fraud alerts)
#   Kafka     localhost:19092         (for tools on your machine)
#
# Host ports are configurable, in case one is already in use on your machine:
#   APP_PORT=28080 KAFKA_UI_PORT=28081 KAFKA_PORT=29093 docker compose up --build
# or put them in a .env file next to this file (see .env.example).
#
# AI assistant (Spring AI): a local Ollama model, no API key. The ollama-pull service downloads the
# model once (~2 GB, kept in a volume); until it finishes, POST /api/assistant answers 503.
# Use Claude instead:  SPRING_AI_MODEL_CHAT=anthropic ANTHROPIC_API_KEY=... docker compose up --build
#
# The load-generator service sends random transactions once the app is ready, then exits.
# Re-run it any time:  docker compose run --rm load-generator
# Stop and wipe data:  docker compose down -v
services:
  kafka:
    image: apache/kafka:3.9.1
    hostname: kafka
    ports:
      - "${KAFKA_PORT:-19092}:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:${KAFKA_PORT:-19092}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      # single broker => replication 1, needed for exactly_once_v2 transactions
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      # use the INTERNAL listener: the EXTERNAL one advertises the host port, unreachable inside the container
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 10

  banker-platform:
    build: .
    image: banker-platform:local
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "${APP_PORT:-18080}:8080"
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:3b}
      SPRING_AI_MODEL_CHAT: ${SPRING_AI_MODEL_CHAT:-ollama}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-not-set}
    volumes:
      - streams-state:/var/lib/kafka-streams
    healthcheck:
      # no curl in the JRE image: use bash's /dev/tcp to call the readiness endpoint
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/localhost/8080 && printf 'GET /actuator/health/readiness HTTP/1.0\\r\\n\\r\\n' >&3 && head -1 <&3 | grep -q ' 200 '"]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 12

  ollama:
    image: ollama/ollama:0.40.14
    volumes:
      - ollama-models:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 10

  ollama-pull:
    image: ollama/ollama:0.40.14
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ["ollama", "pull", "${OLLAMA_MODEL:-qwen2.5:3b}"]
    restart: "no"

  kafka-ui:
    image: provectuslabs/kafka-ui:v0.7.2
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "${KAFKA_UI_PORT:-18081}:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092

  load-generator:
    image: python:3.12-slim
    depends_on:
      banker-platform:
        condition: service_healthy
    volumes:
      - ./scripts:/scripts:ro
    command: ["python3", "-I", "/scripts/load_generator.py", "--url", "http://banker-platform:8080", "--count", "200", "--wait"]
    restart: "no"

volumes:
  kafka-data:
  streams-state:
  ollama-models:
