# GitHub Actions equivalent of .gitlab-ci.yml
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  packages: write

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Build, unit + integration tests
        run: mvn -B --no-transfer-progress verify
      - name: Validate Kubernetes manifests
        run: |
          kubectl kustomize k8s/overlays/dev > /dev/null
          kubectl kustomize k8s/overlays/prod > /dev/null
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-reports
          path: target/*-reports/

  image:
    needs: build-test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/banker-platform:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
